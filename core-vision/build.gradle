plugins {
    id 'com.android.library'
}

android {
    namespace 'com.vadas.core.vision'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    aaptOptions {
        noCompress "tflite"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':core-camera')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.12.0'

    // TensorFlow Lite runtime & GPU acceleration
    def tflite_version = "2.14.0"
    api "org.tensorflow:tensorflow-lite:${tflite_version}"
    api "org.tensorflow:tensorflow-lite-gpu:${tflite_version}"
    api "org.tensorflow:tensorflow-lite-gpu-api:${tflite_version}"
    api "org.tensorflow:tensorflow-lite-support:0.4.4"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
